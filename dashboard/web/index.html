<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Uutiskirje</title>
<script src="js/theme.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/ui.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/articles.css">
<link rel="stylesheet" href="css/newsletter.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="splash" id="splash" role="status">
  <img src="img/brand/eoppimiskeskus.png" width="304" height="60" alt="Suomen eOppimiskeskus ry">
  <span class="splash-bar" aria-hidden="true"><i></i></span>
  <span class="splash-word" data-t="app.loading"></span>
</div>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="#/">
      <svg class="mark" width="30" height="30" viewBox="0 0 34 34" aria-hidden="true">
        <circle class="ring" cx="17" cy="17" r="15"/>
        <path class="letter" d="M9 19.5h13a7 7 0 1 0-7-7v14"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name" data-t="app.name"></span>
        <span class="brand-org" data-t="app.org"></span>
      </span>
    </a>
    <nav class="mainnav" id="mainnav" data-t-label="nav.label" hidden>
      <a href="#/" data-page="articles"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="4.5" width="16" height="15" rx="2"/><path d="M7.5 8.5h9M7.5 12h9M7.5 15.5h5.5"/></svg><span data-t="nav.articles"></span></a>
      <a href="#/newsletters" data-page="newsletters"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4.5 7l7.5 6 7.5-6"/></svg><span data-t="nav.newsletters"></span></a>
      <a href="#/settings" data-page="settings" data-admin hidden><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span data-t="nav.settings"></span></a>
    </nav>
    <div class="topbar-end">
      <button type="button" class="topbar-link langswitch" id="langswitch" data-t="lang.switch"></button>
      <button type="button" class="user-btn" id="usermenu" hidden>
        <span class="user-avatar" id="user-avatar" aria-hidden="true"></span>
        <span class="user-name" id="who-name"></span>
        <svg class="icon user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 9.5l5.5 5.5 5.5-5.5"/></svg>
      </button>
    </div>
  </div>
</header>
<main class="wrap page" id="view">
  <p class="loading">…</p>
</main>
<noscript><p class="wrap">Tämä sivu tarvitsee JavaScriptin. The dashboard needs JavaScript switched on.</p></noscript>
</body>
</html>
